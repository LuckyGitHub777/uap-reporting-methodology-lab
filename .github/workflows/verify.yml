name: Verify synthetic reporting lab
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact released file hashes
        run: sha256sum --check --strict MANIFEST.sha256
      - name: Exercise offline learning contract
        run: python -m unittest discover -s tests -v
